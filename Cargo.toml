[package]
name = "tario"
description = "Asynchronously read and write TAR archives"
authors = ["Akis Kesoglou <akiskesoglou@gmail.com>"]
license = "MIT"
repository = "https://github.com/dfunckt/tario"
keywords = ["tar", "async", "io", "futures", "tokio"]
categories = ["asynchronous", "encoding", "filesystem"]    # TODO: "no-std::no-alloc", "wasm"

version = "0.2.0"
edition = "2024"

[dependencies]
pin-project-lite = { version = "0.2", default-features = false }
tar = { version = "0.4", default-features = false }
tokio = { version = "1", default-features = false }

[dev-dependencies]
rand = { version = "0.10", default-features = false, features = ["thread_rng"] }
tokio = { version = "1", default-features = false, features = ["rt", "fs", "macros", "io-util"] }

[features]
# Log debug info to stderr. For development only.
tracing = []

[package.metadata.docs.rs]
all-features = true
